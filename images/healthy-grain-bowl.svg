<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <clipPath id="bowl-inner">
      <circle cx="300" cy="225" r="145"/>
    </clipPath>
    <pattern id="quinoa" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f2deb0"/>
      <circle cx="4" cy="4" r="2.6" fill="#e2c78c"/>
      <circle cx="11" cy="10" r="2.2" fill="#fff6e2"/>
      <circle cx="10" cy="3" r="1.6" fill="#d9b978"/>
    </pattern>
    <g id="slice">
      <rect x="-48" y="-15" width="96" height="30" rx="15" fill="#e0a75a"/>
      <rect x="-42" y="-14" width="84" height="11" rx="5.5" fill="#efc485"/>
      <path d="M-26 -13 L-33 13 M-6 -13 L-13 13 M14 -13 L7 13 M34 -13 L27 13" stroke="#a5652a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="avo">
      <path d="M-50 6 C-32 -30 32 -30 50 6 C30 -4 -30 -4 -50 6 Z" fill="#3e6b26"/>
      <path d="M-43 3 C-27 -22 27 -22 43 3 C26 -5 -26 -5 -43 3 Z" fill="#b5d66a"/>
      <path d="M-33 0 C-19 -13 19 -13 33 0 C19 -5 -19 -5 -33 0 Z" fill="#eef4bd"/>
    </g>
  </defs>

  <rect width="600" height="450" fill="#e6f2e2"/>
  <circle cx="300" cy="225" r="205" fill="#d6ebcf"/>

  <!-- lemon wedge -->
  <g transform="translate(96 92) rotate(-25)">
    <path d="M-48 0 A48 48 0 0 1 48 0 Z" fill="#f2c230"/>
    <path d="M-40 -3 A40 40 0 0 1 40 -3 Z" fill="#fbe58f"/>
    <path d="M0 -4 L0 -38 M0 -4 L-27 -28 M0 -4 L27 -28" stroke="#f2c230" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- basil leaves -->
  <ellipse cx="78" cy="368" rx="32" ry="14" transform="rotate(-35 78 368)" fill="#3f8a4d"/>
  <ellipse cx="116" cy="392" rx="26" ry="12" transform="rotate(15 116 392)" fill="#5aa860"/>

  <!-- fork -->
  <g fill="#b7c5bc">
    <rect x="505" y="100" width="5" height="58" rx="2.5"/>
    <rect x="514" y="100" width="5" height="58" rx="2.5"/>
    <rect x="523" y="100" width="5" height="58" rx="2.5"/>
    <rect x="532" y="100" width="5" height="58" rx="2.5"/>
    <path d="M505 150 h32 v10 q0 22 -16 26 q-16 -4 -16 -26 z"/>
    <rect x="514" y="180" width="14" height="180" rx="7"/>
  </g>

  <!-- bowl -->
  <circle cx="310" cy="238" r="165" fill="#1d4a2a" opacity="0.12"/>
  <circle cx="300" cy="225" r="165" fill="#ffffff"/>

  <g clip-path="url(#bowl-inner)">
    <rect x="150" y="75" width="300" height="300" fill="url(#quinoa)"/>

    <!-- greens -->
    <path d="M300 225 L140 225 A160 160 0 0 1 300 65 Z" fill="#3f8a4d"/>
    <ellipse cx="205" cy="200" rx="36" ry="16" transform="rotate(-25 205 200)" fill="#5aa860"/>
    <ellipse cx="238" cy="150" rx="34" ry="15" transform="rotate(25 238 150)" fill="#2f7a40"/>
    <ellipse cx="270" cy="108" rx="30" ry="13" transform="rotate(-15 270 108)" fill="#6db36a"/>
    <ellipse cx="190" cy="152" rx="30" ry="14" transform="rotate(50 190 152)" fill="#4b9656"/>
    <ellipse cx="248" cy="200" rx="28" ry="12" transform="rotate(-50 248 200)" fill="#7cc07a"/>
    <ellipse cx="278" cy="160" rx="22" ry="10" transform="rotate(70 278 160)" fill="#3c8a4a"/>
    <ellipse cx="225" cy="105" rx="22" ry="10" transform="rotate(-60 225 105)" fill="#5aa860"/>
    <path d="M178 213 L232 187 M234 217 L262 183 M247 114 L293 102" stroke="#2f7a40" stroke-width="2" stroke-linecap="round"/>

    <!-- tomatoes -->
    <path d="M300 225 L300 65 A160 160 0 0 1 438.6 145 Z" fill="#7cbf6e"/>
    <circle cx="330" cy="104" r="19" fill="#e2553f"/>
    <circle cx="373" cy="122" r="18" fill="#d9472f"/>
    <circle cx="347" cy="160" r="18" fill="#e2553f"/>
    <circle cx="394" cy="168" r="16" fill="#d9472f"/>
    <circle cx="316" cy="148" r="15" fill="#ea6a50"/>
    <g fill="#ffffff" opacity="0.45">
      <ellipse cx="323" cy="97" rx="6" ry="4"/>
      <ellipse cx="366" cy="115" rx="6" ry="4"/>
      <ellipse cx="340" cy="153" rx="6" ry="4"/>
      <ellipse cx="388" cy="162" rx="5" ry="3.5"/>
      <ellipse cx="311" cy="142" rx="5" ry="3.5"/>
    </g>
    <g fill="#2f7a40">
      <circle cx="334" cy="88" r="3.5"/>
      <circle cx="377" cy="106" r="3.5"/>
      <circle cx="351" cy="144" r="3.5"/>
    </g>

    <!-- grilled chicken -->
    <path d="M300 225 L438.6 145 A160 160 0 0 1 380 363.6 Z" fill="#f3dcb0"/>
    <use href="#slice" transform="translate(372 188) rotate(-28)"/>
    <use href="#slice" transform="translate(388 222) rotate(-12)"/>
    <use href="#slice" transform="translate(392 258) rotate(4)"/>
    <use href="#slice" transform="translate(384 294) rotate(20)"/>

    <!-- avocado -->
    <path d="M300 225 L380 363.6 A160 160 0 0 1 197.2 347.6 Z" fill="#e4efc0"/>
    <use href="#avo" transform="translate(252 318) rotate(-28)"/>
    <use href="#avo" transform="translate(294 334) rotate(-4)"/>
    <use href="#avo" transform="translate(336 322) rotate(22)"/>

    <!-- chickpeas on the quinoa -->
    <g fill="#e7bf73">
      <circle cx="205" cy="265" r="9"/>
      <circle cx="222" cy="290" r="9"/>
      <circle cx="190" cy="288" r="8"/>
      <circle cx="238" cy="262" r="8"/>
    </g>
    <g fill="#f6dca3">
      <circle cx="202" cy="262" r="3"/>
      <circle cx="219" cy="287" r="3"/>
      <circle cx="187" cy="285" r="2.6"/>
      <circle cx="235" cy="259" r="2.6"/>
    </g>

    <!-- tahini drizzle and sesame -->
    <path d="M178 205 C228 248 288 182 338 232 S410 262 432 228" fill="none" stroke="#fff7e8" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
    <g fill="#fffaf0">
      <ellipse cx="262" cy="232" rx="3" ry="1.6" transform="rotate(30 262 232)"/>
      <ellipse cx="312" cy="200" rx="3" ry="1.6" transform="rotate(-20 312 200)"/>
      <ellipse cx="356" cy="270" rx="3" ry="1.6" transform="rotate(50 356 270)"/>
      <ellipse cx="288" cy="290" rx="3" ry="1.6" transform="rotate(10 288 290)"/>
      <ellipse cx="226" cy="180" rx="3" ry="1.6" transform="rotate(-40 226 180)"/>
    </g>
    <g fill="#1d2a22">
      <ellipse cx="276" cy="212" rx="2.6" ry="1.4" transform="rotate(-30 276 212)"/>
      <ellipse cx="330" cy="246" rx="2.6" ry="1.4" transform="rotate(20 330 246)"/>
      <ellipse cx="300" cy="268" rx="2.6" ry="1.4" transform="rotate(-60 300 268)"/>
    </g>
  </g>

  <circle cx="300" cy="225" r="145" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="8"/>
  <circle cx="300" cy="225" r="165" fill="none" stroke="#e9e0cf" stroke-width="2"/>
</svg>
