<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <pattern id="rice" width="16" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#fffdf8"/>
      <ellipse cx="5" cy="4" rx="4" ry="1.8" fill="#ece1cc" transform="rotate(25 5 4)"/>
      <ellipse cx="12" cy="9" rx="4" ry="1.8" fill="#ece1cc" transform="rotate(-20 12 9)"/>
    </pattern>
    <g id="chicken">
      <rect x="-55" y="-17" width="110" height="34" rx="17" fill="#dda15a"/>
      <rect x="-48" y="-16" width="96" height="12" rx="6" fill="#edc07f"/>
      <path d="M-30 -15 L-38 15 M-8 -15 L-16 15 M14 -15 L6 15 M36 -15 L28 15" stroke="#a5652a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="broccoli">
      <path d="M-6 0 h12 l4 30 h-20 z" fill="#8cc77f"/>
      <circle cx="-14" cy="-4" r="15" fill="#2f7a40"/>
      <circle cx="12" cy="-6" r="16" fill="#3f8a4d"/>
      <circle cx="0" cy="-18" r="16" fill="#3c8a4a"/>
      <circle cx="-5" cy="-12" r="6" fill="#5aa860"/>
      <circle cx="9" cy="-10" r="5" fill="#5aa860"/>
    </g>
  </defs>

  <rect width="600" height="450" fill="#fdebe3"/>
  <circle cx="300" cy="225" r="205" fill="#fbdccf"/>

  <!-- protein badge -->
  <g transform="translate(78 72)">
    <circle r="50" fill="#a63a1a"/>
    <text y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff">52 g</text>
    <text y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffe1d5">protein</text>
  </g>

  <!-- fork -->
  <g fill="#b7c5bc">
    <rect x="50" y="160" width="5" height="54" rx="2.5"/>
    <rect x="59" y="160" width="5" height="54" rx="2.5"/>
    <rect x="68" y="160" width="5" height="54" rx="2.5"/>
    <rect x="77" y="160" width="5" height="54" rx="2.5"/>
    <path d="M50 206 h32 v10 q0 22 -16 26 q-16 -4 -16 -26 z"/>
    <rect x="59" y="236" width="14" height="160" rx="7"/>
  </g>

  <!-- knife -->
  <g>
    <path d="M530 70 q26 34 20 136 h-20 z" fill="#d3dcd6"/>
    <rect x="529" y="204" width="20" height="170" rx="10" fill="#4b5850"/>
  </g>

  <!-- plate -->
  <circle cx="308" cy="236" r="172" fill="#1d2a22" opacity="0.08"/>
  <circle cx="300" cy="225" r="172" fill="#ffffff"/>
  <circle cx="300" cy="225" r="148" fill="#fbf8f3" stroke="#efe6da" stroke-width="3"/>

  <!-- rice -->
  <ellipse cx="236" cy="288" rx="84" ry="62" fill="url(#rice)" stroke="#f1e8d8" stroke-width="2"/>

  <!-- broccoli -->
  <use href="#broccoli" transform="translate(215 162) rotate(-20)"/>
  <use href="#broccoli" transform="translate(262 132) rotate(10)"/>
  <use href="#broccoli" transform="translate(190 216) rotate(-40)"/>
  <use href="#broccoli" transform="translate(256 190) rotate(15)"/>

  <!-- grilled chicken -->
  <use href="#chicken" transform="translate(364 154) rotate(-18)"/>
  <use href="#chicken" transform="translate(382 198) rotate(-8)"/>
  <use href="#chicken" transform="translate(388 242) rotate(2)"/>
  <use href="#chicken" transform="translate(380 286) rotate(12)"/>

  <!-- chimichurri -->
  <g fill="#2f7a40">
    <circle cx="352" cy="150" r="3"/>
    <circle cx="376" cy="196" r="3"/>
    <circle cx="398" cy="238" r="3"/>
    <circle cx="372" cy="282" r="3"/>
    <circle cx="410" cy="206" r="2.5"/>
  </g>
  <g fill="#5aa860">
    <circle cx="340" cy="160" r="2.5"/>
    <circle cx="392" cy="248" r="2.5"/>
    <circle cx="364" cy="290" r="2.5"/>
    <circle cx="388" cy="160" r="2.5"/>
  </g>

  <!-- lemon wedge -->
  <g transform="translate(330 338) rotate(-10)">
    <path d="M-30 0 A30 30 0 0 1 30 0 Z" fill="#f2c230"/>
    <path d="M-24 -2 A24 24 0 0 1 24 -2 Z" fill="#fbe58f"/>
    <path d="M0 -3 L0 -22 M0 -3 L-16 -16 M0 -3 L16 -16" stroke="#f2c230" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
