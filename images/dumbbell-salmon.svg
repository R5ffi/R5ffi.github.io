  <path d="M160 302 C170 257 260 247 330 264 C380 276 400 302 392 332 C360 362 240 367 175 347 C160 340 156 320 160 302 Z" fill="#f28b5b"/>
  <path d="M175 347 C240 367 360 362 392 332 C388 346 372 356 352 362 C290 376 212 370 178 356 Z" fill="#c95f36"/>
