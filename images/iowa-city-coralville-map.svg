<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <g id="pin">
      <path d="M0 0 C-5 -9 -16 -18 -16 -31 A16 16 0 1 1 16 -31 C16 -18 5 -9 0 0 Z"/>
      <circle cx="0" cy="-31" r="6.5" fill="#ffffff"/>
    </g>
    <clipPath id="coralville-area">
      <rect x="36" y="88" width="214" height="230" rx="36"/>
    </clipPath>
    <clipPath id="downtown-area">
      <rect x="344" y="150" width="222" height="230" rx="36"/>
    </clipPath>
  </defs>

  <rect width="600" height="450" fill="#fff3dc"/>

  <!-- parks -->
  <ellipse cx="80" cy="410" rx="100" ry="62" fill="#d6ebcf"/>
  <ellipse cx="560" cy="56" rx="90" ry="58" fill="#d6ebcf"/>

  <!-- neighborhoods -->
  <rect x="36" y="88" width="214" height="230" rx="36" fill="#fbe2a8"/>
  <rect x="344" y="150" width="222" height="230" rx="36" fill="#d9ebd2"/>

  <g clip-path="url(#coralville-area)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <path d="M36 150 C100 130 160 170 250 140"/>
    <path d="M36 270 C110 250 170 290 250 262"/>
    <path d="M120 88 C100 160 140 240 110 318"/>
    <path d="M200 88 C215 170 185 240 210 318"/>
  </g>

  <g clip-path="url(#downtown-area)" stroke="#ffffff" stroke-width="6">
    <path d="M390 150 V380 M435 150 V380 M480 150 V380 M525 150 V380 M344 195 H566 M344 240 H566 M344 285 H566 M344 330 H566"/>
  </g>

  <!-- river -->
  <path d="M300 0 C250 80 330 150 285 230 S250 380 300 450" fill="none" stroke="#9fcbe8" stroke-width="34"/>
  <path d="M300 0 C250 80 330 150 285 230 S250 380 300 450" fill="none" stroke="#c4e2f4" stroke-width="4" stroke-dasharray="10 26"/>

  <!-- road and bridge between the two areas -->
  <path d="M150 210 C230 210 300 260 455 262" fill="none" stroke="#e2d3b8" stroke-width="22" stroke-linecap="round"/>
  <path d="M150 210 C230 210 300 260 455 262" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Coralville picks -->
  <g fill="#d9472f">
    <use href="#pin" x="90" y="170"/>
    <use href="#pin" x="150" y="142"/>
    <use href="#pin" x="206" y="182"/>
    <use href="#pin" x="104" y="252"/>
    <use href="#pin" x="170" y="242"/>
    <use href="#pin" x="214" y="292"/>
  </g>

  <!-- Downtown Iowa City picks -->
  <g fill="#2b6a3d">
    <use href="#pin" x="392" y="215"/>
    <use href="#pin" x="440" y="200"/>
    <use href="#pin" x="500" y="212"/>
    <use href="#pin" x="542" y="234"/>
    <use href="#pin" x="410" y="282"/>
    <use href="#pin" x="468" y="262"/>
    <use href="#pin" x="525" y="292"/>
    <use href="#pin" x="430" y="347"/>
    <use href="#pin" x="495" y="352"/>
  </g>

  <!-- labels -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="46" y="332" width="190" height="58" rx="14" fill="#ffffff"/>
    <text x="141" y="357" font-size="21" font-weight="700" fill="#573f00">Coralville</text>
    <text x="141" y="379" font-size="15" fill="#4b5850">6 picks</text>

    <rect x="336" y="80" width="238" height="58" rx="14" fill="#ffffff"/>
    <text x="455" y="105" font-size="20" font-weight="700" fill="#1d4a2a">Downtown Iowa City</text>
    <text x="455" y="127" font-size="15" fill="#4b5850">9 picks</text>
  </g>

  <!-- compass -->
  <g transform="translate(50 44)">
    <circle r="24" fill="#ffffff"/>
    <path d="M0 -15 L7 6 L0 2 L-7 6 Z" fill="#d9472f"/>
    <text y="19" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1d2a22">N</text>
  </g>
</svg>
